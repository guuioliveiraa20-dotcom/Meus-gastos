<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Gastos Mensais</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="header-title">
        <span class="header-icon">◈</span>
        <h1>Meus Gastos</h1>
      </div>
      <div class="mes-selector">
        <button id="btnMesAnterior" class="btn-mes">‹</button>
        <span id="labelMes" class="label-mes"></span>
        <button id="btnMesProximo" class="btn-mes">›</button>
      </div>
    </div>
  </header>

  <main class="main">

    <!-- CARDS DE RESUMO -->
    <section class="resumo-grid">
      <div class="card card-receita">
        <p class="card-label">Receitas</p>
        <p class="card-valor" id="totalReceitas">R$ 0,00</p>
        <div class="card-bar"><div class="card-bar-fill receita-fill" id="barReceita"></div></div>
      </div>
      <div class="card card-despesa">
        <p class="card-label">Despesas</p>
        <p class="card-valor" id="totalDespesas">R$ 0,00</p>
        <div class="card-bar"><div class="card-bar-fill despesa-fill" id="barDespesa"></div></div>
      </div>
      <div class="card card-saldo">
        <p class="card-label">Saldo</p>
        <p class="card-valor" id="totalSaldo">R$ 0,00</p>
        <p class="card-sub" id="saldoStatus">—</p>
      </div>
    </section>

    <!-- FORMULÁRIO -->
    <section class="form-section">
      <h2 class="section-title">Novo Lançamento</h2>
      <div class="form-grid">
        <div class="form-group span2">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" placeholder="Ex: Supermercado, Salário...">
        </div>
        <div class="form-group">
          <label for="valor">Valor (R$)</label>
          <input type="number" id="valor" placeholder="0,00" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label for="tipo">Tipo</label>
          <select id="tipo">
            <option value="despesa">💸 Despesa</option>
            <option value="receita">💰 Receita</option>
          </select>
        </div>
        <div class="form-group">
          <label for="categoria">Categoria</label>
          <select id="categoria">
            <option value="Alimentação">🍔 Alimentação</option>
            <option value="Moradia">🏠 Moradia</option>
            <option value="Transporte">🚗 Transporte</option>
            <option value="Saúde">💊 Saúde</option>
            <option value="Educação">📚 Educação</option>
            <option value="Lazer">🎮 Lazer</option>
            <option value="Vestuário">👗 Vestuário</option>
            <option value="Salário">💼 Salário</option>
            <option value="Outros">📦 Outros</option>
          </select>
        </div>
        <div class="form-group">
          <label for="data">Data</label>
          <input type="date" id="data">
        </div>
        <div class="form-group span-full btn-group">
          <button id="btnAdicionar" class="btn-primary">+ Adicionar</button>
        </div>
      </div>
    </section>

    <!-- LISTA DE LANÇAMENTOS -->
    <section class="lista-section">
      <div class="lista-header">
        <h2 class="section-title">Lançamentos</h2>
        <div class="filtros">
          <button class="filtro-btn ativo" data-filtro="todos">Todos</button>
          <button class="filtro-btn" data-filtro="receita">Receitas</button>
          <button class="filtro-btn" data-filtro="despesa">Despesas</button>
        </div>
      </div>
      <div id="listaGastos" class="lista-gastos">
        <div class="lista-vazia">
          <span>◈</span>
          <p>Nenhum lançamento ainda.<br>Adicione seu primeiro gasto ou receita acima.</p>
        </div>
      </div>
    </section>

    <!-- GRÁFICO POR CATEGORIA -->
    <section class="categorias-section">
      <h2 class="section-title">Despesas por Categoria</h2>
      <div id="graficoCategorias" class="grafico-categorias">
        <p class="lista-vazia-small">Sem dados para exibir.</p>
      </div>
    </section>

  </main>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
